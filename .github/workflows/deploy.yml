name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vite env
        run: |
          node <<'NODE'
          const url = process.env.VITE_SUPABASE_URL;
          const anonKey = process.env.VITE_SUPABASE_ANON_KEY;

          if (!url || !anonKey) {
            throw new Error('VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are required.');
          }

          const parsedUrl = new URL(url);
          if (parsedUrl.pathname !== '/' || parsedUrl.search || parsedUrl.hash) {
            throw new Error('VITE_SUPABASE_URL must be the Supabase Project URL root. Do not include /rest/v1.');
          }

          const [, payload] = anonKey.split('.');
          if (!payload) {
            throw new Error('VITE_SUPABASE_ANON_KEY must be the Supabase anon public JWT.');
          }

          const normalizedPayload = payload.replace(/-/g, '+').replace(/_/g, '/');
          const decodedPayload = JSON.parse(
            Buffer.from(
              normalizedPayload + '='.repeat((4 - (normalizedPayload.length % 4)) % 4),
              'base64',
            ).toString('utf8'),
          );

          if (decodedPayload.role !== 'anon') {
            throw new Error('VITE_SUPABASE_ANON_KEY must be anon public key. Never use service_role or secret keys in frontend builds.');
          }
          NODE
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
